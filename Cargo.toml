[package]
name = "anz"
version = "0.3.1"
edition = "2021"
description = "A minimal, personal OIDC provider for securing small web applications"
license = "MIT"
repository = "https://github.com/navicore/anz"

[dependencies]
axum = { version = "0.8", features = ["form", "query"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
password-hash = "0.5"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
askama = "0.12"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
thiserror = "2"
anyhow = "1"
rpassword = "5"
mime_guess = "2"
